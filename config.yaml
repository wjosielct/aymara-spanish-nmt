# ==============================================================================
# GLOBAL CONFIGURATION & EXPERIMENT
# ==============================================================================
seed: 1989
src: "aym"
tgt: "spa"

# ==============================================================================
# PATHS AND DIRECTORIES (Data Pipeline & Artifacts)
# ==============================================================================
raw_bible_data_dir: "data/raw/bible"
raw_pdf_dir: "data/raw/book"
interim_data_dir: "data/interim"
clean_data_dir: "data/clean"
splits_dir: "data/splits"
tokenizer_dir: "tokenizer"
tokenized_dir: "data/tokenized"
models_dir: "models"
results_dir: "results"

# ==============================================================================
# BIBLICAL CORPUS (Download / Alignment)
# ==============================================================================
bibles:
  - code: 293 # Qullan Arunaca © Sociedad Bíblica Boliviana
    lang: aym
  - code: 2250 # Qullan Arunaka DC © Sociedad Bíblica Boliviana
    lang: aym
  - code: 4278 # Dios habla hoy 4ta edición © Sociedades Bíblicas Unidas 
    lang: spa
  - code: 146 # Reina Valera Contemporánea © Sociedades Bíblicas Unidas
    lang: spa

# ==============================================================================
# PREPROCESSING & LENGTH FILTERING
# ==============================================================================
min_words_bible: 2
min_words_book: 1
max_words: 70
max_ratio: 3.5

# ==============================================================================
# DATASET SPLITS
# ==============================================================================
bible_train_ratio: 0.90
bible_val_ratio: 0.05
bible_test_ratio: 0.05

book_train_ratio: 0.70
book_val_ratio: 0.15
book_test_ratio: 0.15

# ==============================================================================
# TOKENIZER (SentencePiece)
# ==============================================================================
vocab_size: 8000
model_type: "bpe"
character_coverage: 1.0

# ==============================================================================
# TRANSFORMER ARCHITECTURE
# ==============================================================================
d_model: 256
n_heads: 8
encoder_layers: 4
decoder_layers: 4
dim_feedforward: 1024
dropout: 0.2

# ==============================================================================
# BASE TRAINING (Biblical Corpus)
# ==============================================================================
epochs: 150
batch_size_cuda: 64
batch_size_cpu: 32
lr: 0.0005
lr_pct_start: 0.1
anneal_strategy: "cos"
adam_beta1: 0.9
adam_beta2: 0.98
adam_eps: 1e-9
weight_decay: 1e-4
label_smoothing: 0.1
grad_clip_norm: 1.0

# ==============================================================================
# VALIDATION DURING TRAINING (In-Domain)
# ==============================================================================
val_eval_interval_epochs: 10
val_beam_size: 1
val_max_len: 150
val_alpha: 0.6
max_samples_ratio: 0.20

# ==============================================================================
# DOMAIN FINE-TUNING (Adaptation to OOD)
# ==============================================================================
ft_epochs: 20
ft_lr: 0.0001
ft_batch_size: 16
ft_val_eval_interval: 2

# ==============================================================================
# FINAL EVALUATION IN TEST SETS (In-Domain & Out-of-Domain)
# ==============================================================================
test_beam_size: 4
test_max_len: 150
test_alpha: 0.6